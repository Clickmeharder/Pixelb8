<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>PixelB8 Entropia Controller</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;--bg:#070b12;--panel:#101824;--line:#2b405e;--text:#eef5ff;--muted:#8fa8c9;--good:#54e39b;--bad:#ff7885}*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:9px;gap:8px}.top{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:8px 10px}.brand{font-weight:900;font-size:14px;white-space:nowrap}.status{font-size:11px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:#795}.connected .dot{background:var(--good);box-shadow:0 0 9px var(--good)}.room{width:108px;background:#09111b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 7px;font-size:11px}.connect{padding:7px 9px;border-radius:8px;border:1px solid #3d5677;background:#1c2b40;color:white}.play{min-height:0;display:grid;grid-template-columns:minmax(180px,1fr) minmax(250px,1.18fr);gap:10px}.side{position:relative;background:linear-gradient(180deg,#0e1723,#0a111b);border:1px solid var(--line);border-radius:18px;overflow:hidden}.stickZone{position:absolute;inset:0;display:grid;place-items:center}.stickBase{width:min(52vw,240px);height:min(52vw,240px);max-width:72%;max-height:72%;aspect-ratio:1;border-radius:50%;border:2px solid #385274;background:radial-gradient(circle,#16243a 0 18%,#0c1624 19% 55%,#111e30 56%);position:relative;box-shadow:inset 0 0 28px #0008}.stickKnob{position:absolute;left:50%;top:50%;width:34%;height:34%;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#4e719e,#1c304d 65%);border:2px solid #6f96c7;box-shadow:0 4px 18px #000c}.dirs{position:absolute;inset:7px;font-size:10px;color:#7890af;pointer-events:none}.dirs span{position:absolute}.dirs .n{top:0;left:50%;transform:translateX(-50%)}.dirs .s{bottom:0;left:50%;transform:translateX(-50%)}.dirs .w{left:0;top:50%;transform:translateY(-50%)}.dirs .e{right:0;top:50%;transform:translateY(-50%)}.buttons{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;padding:9px;height:100%}.btn{border-radius:15px;border:1px solid #3b5578;background:linear-gradient(#1b2b43,#111d2e);color:white;font-weight:800;min-width:0;min-height:0;box-shadow:inset 0 1px #ffffff12}.btn:active,.btn.active{transform:translateY(1px);background:linear-gradient(#29456c,#14243a);border-color:#7296c6}.btn small{display:block;font-size:9px;font-weight:500;color:#a8bad2}.action{grid-column:3/5;grid-row:1/3;border-radius:50%;justify-self:center;align-self:center;width:min(28vw,135px);height:min(28vw,135px);background:radial-gradient(circle at 35% 28%,#9f4453,#521d29 67%);border-color:#c96375}.jump{grid-column:2/4;grid-row:3}.interact{grid-column:1;grid-row:2}.target{grid-column:1;grid-row:1}.rotateL{grid-column:1;grid-row:3}.rotateR{grid-column:4;grid-row:3}.sit{grid-column:1;grid-row:4}.run{grid-column:4;grid-row:4}.release{grid-column:2/4;grid-row:4;background:#4b1e26;border-color:#9f4653}.hotbar{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.hotbar .btn{height:42px;border-radius:9px;padding:2px;font-size:13px}.desktop{font-size:10px;color:var(--muted);text-align:center;margin-top:3px}.desktop.ok{color:var(--good)}.desktop.bad{color:var(--bad)}
@media (orientation:portrait){.play{grid-template-columns:1fr;grid-template-rows:1fr 1.12fr}.stickBase{width:min(52vh,240px);height:min(52vh,240px)}.action{width:min(22vh,120px);height:min(22vh,120px)}.hotbar .btn{height:36px}.brand{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top" id="top"><span class="dot"></span><span class="brand">PixelB8 Entropia Controller</span><span class="status" id="status">disconnected</span><input id="room" class="room" placeholder="room"><button class="connect" id="connect">Connect</button></div>
  <div class="play">
    <section class="side" id="stickSide"><div class="stickZone" id="stickZone"><div class="stickBase" id="stickBase"><div class="dirs"><span class="n">W</span><span class="s">S</span><span class="w">A</span><span class="e">D</span></div><div class="stickKnob" id="stickKnob"></div></div></div></section>
    <section class="side"><div class="buttons">
      <button class="btn target" data-tap="TAB">TARGET<small>TAB</small></button>
      <button class="btn interact" data-tap="F">USE<small>F</small></button>
      <button class="btn rotateL" data-hold="Q">↶<small>Q</small></button>
      <button class="btn rotateR" data-hold="E">↷<small>E</small></button>
      <button class="btn action" data-tap="3">ACTION<small>3</small></button>
      <button class="btn jump" data-tap="SPACE">JUMP <small>SPACE</small></button>
      <button class="btn sit" data-tap="X">SIT<small>X</small></button>
      <button class="btn run" data-hold="SHIFT">RUN<small>SHIFT</small></button>
      <button class="btn release" id="release">RELEASE ALL</button>
    </div></section>
  </div>
  <div><div class="hotbar" id="hotbar"></div><div class="desktop" id="desktop">Desktop bridge status unknown.</div></div>
</div>
<script>
const BROKER='wss://broker.emqx.io:8084/mqtt';
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);let room=params.get('room')||localStorage.getItem('pixelb8RemoteRoom')||'';let client=null,connected=false;let desktopOnline=false,desktopArmed=false;const held=new Set();let heartbeat=null;let stickPointer=null;let stickKeys=new Set();
$('room').value=room;
function base(){return `pixelb8/voicebridge/${room}`}
function setStatus(text,ok=false){$('status').textContent=text;$('top').classList.toggle('connected',ok)}
function publish(obj){if(!client?.connected||!room)return;client.publish(`${base()}/control`,JSON.stringify({...obj,source:'phone-controller',ts:Date.now()}),{qos:0})}
function down(key){if(held.has(key))return;held.add(key);publish({type:'key-down',key});vibe(12)}
function up(key){if(!held.has(key))return;held.delete(key);publish({type:'key-up',key})}
function tap(key){publish({type:'tap',key,duration:55});vibe(20)}
function releaseAll(localOnly=false){for(const k of [...held])held.delete(k);stickKeys.clear();if(!localOnly)publish({type:'release-all'});resetStick()}
function vibe(ms){try{navigator.vibrate?.(ms)}catch{}}
function connect(){room=$('room').value.trim();if(!/^[A-Za-z0-9_-]{6,64}$/.test(room)){setStatus('enter valid room');return}localStorage.setItem('pixelb8RemoteRoom',room);try{client?.end(true)}catch{}setStatus('connecting…');client=mqtt.connect(BROKER,{clientId:'pixelb8-phone-'+Math.random().toString(16).slice(2),clean:true,reconnectPeriod:1500,connectTimeout:10000,keepalive:30});client.on('connect',()=>{connected=true;setStatus('MQTT connected',true);client.subscribe(`${base()}/status`);clearInterval(heartbeat);heartbeat=setInterval(()=>publish({type:'heartbeat'}),500);publish({type:'heartbeat'})});client.on('message',(topic,payload)=>{try{const m=JSON.parse(payload.toString());if(m.type==='desktop-status'){desktopOnline=!!m.online;desktopArmed=!!m.controllerArmed;$('desktop').textContent=desktopOnline?(desktopArmed?'Desktop online · REMOTE ARMED':'Desktop online · arm phone controller on PC'):'Desktop offline';$('desktop').className='desktop '+(desktopOnline&&desktopArmed?'ok':'bad')}}catch{}});client.on('reconnect',()=>setStatus('reconnecting…'));client.on('close',()=>{connected=false;setStatus('disconnected');releaseAll(true)});client.on('error',e=>setStatus('MQTT '+e.message))}
$('connect').onclick=connect;$('room').addEventListener('change',connect);
for(let i=1;i<=10;i++){const key=i===10?'0':String(i);const b=document.createElement('button');b.className='btn';b.textContent=key;b.dataset.tap=key;$('hotbar').appendChild(b)}
function bindButton(el){const hold=el.dataset.hold,tapKey=el.dataset.tap;if(tapKey){el.addEventListener('pointerdown',e=>{e.preventDefault();tap(tapKey);el.classList.add('active')});el.addEventListener('pointerup',()=>el.classList.remove('active'));el.addEventListener('pointercancel',()=>el.classList.remove('active'))}if(hold){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);down(hold);el.classList.add('active')});const end=()=>{up(hold);el.classList.remove('active')};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end)}}document.querySelectorAll('[data-tap],[data-hold]').forEach(bindButton);$('release').onclick=()=>releaseAll();
const zone=$('stickZone'),baseEl=$('stickBase'),knob=$('stickKnob');
function resetStick(){knob.style.transform='translate(-50%,-50%)'}
function updateStick(e){const r=baseEl.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.32;const d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;const nx=dx/max,ny=dy/max;const next=new Set();const dead=.26;if(nx<-dead)next.add('A');if(nx>dead)next.add('D');if(ny<-dead)next.add('W');if(ny>dead)next.add('S');for(const k of stickKeys)if(!next.has(k))up(k);for(const k of next)if(!stickKeys.has(k))down(k);stickKeys=next}
zone.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;zone.setPointerCapture?.(e.pointerId);updateStick(e)});zone.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)updateStick(e)});function endStick(e){if(stickPointer!==null&&(!e||e.pointerId===stickPointer)){for(const k of stickKeys)up(k);stickKeys.clear();stickPointer=null;resetStick()}}zone.addEventListener('pointerup',endStick);zone.addEventListener('pointercancel',endStick);zone.addEventListener('lostpointercapture',endStick);
window.addEventListener('pagehide',()=>releaseAll());window.addEventListener('blur',()=>releaseAll());document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
if(room)connect();
</script>
</body></html>
